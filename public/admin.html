<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Payment Admin Dashboard</title>

  <link rel="stylesheet" href="style.css">

  <script src="admin.js" defer></script>
</head>

<body>

  <main class="page-shell">

    <section class="admin-shell">

      <div class="panel">

        <div class="admin-top">

          <div>
            <p class="eyebrow">MERCHANT TOOLS</p>
            <h1>Payment Dashboard</h1>
          </div>

          <button id="refresh" type="button">
            Refresh
          </button>

        </div>

        <p class="muted">
          Enter your admin password to view transactions.
        </p>

        <label for="password">Admin Password</label>

        <input
          id="password"
          type="password"
          placeholder="Enter admin password"
        >

        <p id="error" class="message"></p>

        <div class="stats">

          <div class="stat">
            <span>Total Transactions</span>
            <strong id="total">—</strong>
          </div>

          <div class="stat">
            <span>Successful</span>
            <strong id="successful">—</strong>
          </div>

          <div class="stat">
            <span>Pending</span>
            <strong id="pending">—</strong>
          </div>

          <div class="stat">
            <span>Successful Value</span>
            <strong id="amount">—</strong>
          </div>

        </div>

        <div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>Date</th>
                <th>Customer</th>
                <th>Amount</th>
                <th>Reference</th>
                <th>Status</th>
              </tr>
            </thead>

            <tbody id="rows">

              <tr>
                <td colspan="5">
                  Log in to load transactions.
                </td>
              </tr>

            </tbody>

          </table>

        </div>

        <a href="/" class="admin-link">
          Back to Payment Page
        </a>

      </div>

    </section>

  </main>

</body>

</html>
